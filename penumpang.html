<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoPir - Penumpang</title>
<style>
:root{
--primary:#00880c;--primary-dark:#006609;--secondary:#0077b6;--light:#f4f6f8;
--dark:#1e293b;--gray:#64748b;--white:#fff;--warning:#f59e0b;--danger:#ef4444;--success:#10b981;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Tahoma,Verdana,sans-serif}
body{background:#e2e8f0;color:var(--dark);display:flex;justify-content:center;min-height:100vh}
.app-container{width:100%;max-width:480px;min-height:100vh;background:#fff;box-shadow:0 0 20px rgba(0,0,0,.1);position:relative}
header{background:var(--primary);color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
header h1{font-size:1.2rem}
.btn-logout{background:rgba(255,255,255,.2);color:#fff;border:0;padding:6px 12px;border-radius:5px;cursor:pointer}
.content{padding:15px;padding-bottom:80px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:15px;margin-bottom:15px;box-shadow:0 2px 4px rgba(0,0,0,.03)}
.btn{width:100%;padding:12px;border:0;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-primary{background:var(--primary);color:#fff}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:.85rem;font-weight:bold;color:var(--gray);margin-bottom:5px}
.form-control{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font-size:.95rem}
.driver-item{padding:8px 0;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between}
.driver-item:last-child{border-bottom:none}
</style>
</head>
<body>

<div class="app-container">

<header>
  <h1>GoPir - Penumpang</h1>
  <button class="btn-logout" onclick="window.location.href='index.html'">Kembali</button>
</header>

<div class="content">

  <!-- KOTAK ANTREAN DRIVER ONLINE -->
  <div class="card" style="border-left: 4px solid var(--primary);">
    <h4>🚗 Driver Siap / Online Saat Ini</h4>
    <div id="p-active-drivers-list" style="margin-top: 10px; font-size: 0.85rem;">
      <p style="color: var(--gray);">Memuat daftar driver...</p>
    </div>
  </div>

  <!-- KOTAK STATUS PESANAN -->
  <div class="card" id="status-card" style="display:none; background:#f0fdf4; border:1px solid #bbf7d0;">
    <h4>Status Pesanan Anda</h4>
    <div id="p-order-status" style="margin-top:8px; font-size:.9rem;">-</div>
    <button onclick="batalkanPesanan()" class="btn" style="background:var(--danger); color:#fff; padding:8px; margin-top:10px; font-size:.85rem;">Batalkan Pesanan</button>
  </div>

  <!-- FORM PEMESANAN -->
  <div class="card" id="form-card">
    <h3>Pesan Layanan GoPir</h3>
    <form onsubmit="handleOrderSubmit(event)">
      <div class="form-group" style="margin-top:10px">
        <label>Jenis Layanan</label>
        <select id="p-jenis" class="form-control" required>
          <option value="Sewa Mobil">Sewa Mobil / Lintas</option>
          <option value="Kirim Paket">Kirim Paket</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nomor Telepon / WhatsApp</label>
        <input type="tel" id="p-telepon" class="form-control" placeholder="08213456789" required>
      </div>
      <div class="form-group">
        <label>Lokasi Penjemputan / Pengirim</label>
        <input type="text" id="p-awal" class="form-control" placeholder="Contoh: Pelabuhan Sofifi" required>
      </div>
      <div class="form-group">
        <label>Lokasi Tujuan / Penerima</label>
        <input type="text" id="p-tujuan" class="form-control" placeholder="Contoh: Tobelo Pasar" required>
      </div>
      <button class="btn btn-primary">Cari & Pesan Driver</button>
    </form>
  </div>

</div>
</div>

<!-- SDK FIREBASE BASE & DATABASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCB9VFST65f7UhMiHg826ZYJaoBXJfY6qs",
  authDomain: "gopir-app.firebaseapp.com",
  databaseURL: "https://gopir-app-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gopir-app",
  storageBucket: "gopir-app.firebasestorage.app",
  messagingSenderId: "213809630129",
  appId: "1:213809630129:web:544ff0f19e442652250b90"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // 1. Memantau Driver yang sedang ONLINE secara Real-time
  db.ref('drivers').on('value', (snapshot) => {
    const drivers = snapshot.val();
    const container = document.getElementById('p-active-drivers-list');
    let onlineHTML = "";
    let countOnline = 0;

    if (drivers) {
      Object.keys(drivers).forEach(phone => {
        const d = drivers[phone];
        // Hanya tampilkan driver yang APPROVED dan sedang ONLINE
        if (d.status === 'APPROVED' && d.online === true) {
          countOnline++;
          onlineHTML += `
            <div class="driver-item">
              <div>
                <strong>${d.nama}</strong> (${d.mobil})
                <br><small style="color: var(--gray);">${d.rute}</small>
              </div>
              <span style="background: var(--success); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight:bold;">Online</span>
            </div>
          `;
        }
      });
    }

    if (countOnline > 0) {
      container.innerHTML = onlineHTML;
    } else {
      container.innerHTML = `<p style="color: var(--danger); font-weight: bold;">Belum ada driver yang online saat ini.</p>`;
    }
  });

  // 2. Memantau Pesanan Aktif
  db.ref('pesanan_aktif').on('value', (snapshot) => {
    const data = snapshot.val();
    const statusCard = document.getElementById('status-card');
    const orderStatus = document.getElementById('p-order-status');

    if (data) {
      statusCard.style.display = 'block';
      if (data.status === 'MENCARI_DRIVER') {
        orderStatus.innerHTML = `<span style="color:var(--warning);font-weight:bold">⏳ Sedang mencari driver...</span><br><small>Rute: ${data.lokasiAwal} ➔ ${data.lokasiTujuan}</small>`;
      } else if (data.status === 'DITERIMA') {
        orderStatus.innerHTML = `<span style="color:var(--success);font-weight:bold">✅ Driver telah menerima pesanan Anda!</span><br><small>Driver sedang menuju ke lokasi penjemputan.</small>`;
      }
    } else {
      statusCard.style.display = 'none';
    }
  });

  // 3. Mengirim Pesanan
  function handleOrderSubmit(e) {
    e.preventDefault();
    const orderData = {
      jenis: document.getElementById('p-jenis').value,
      teleponPenumpang: document.getElementById('p-telepon').value.trim(),
      lokasiAwal: document.getElementById('p-awal').value.trim(),
      lokasiTujuan: document.getElementById('p-tujuan').value.trim(),
      status: 'MENCARI_DRIVER',
      waktu: new Date().toLocaleString('id-ID')
    };

    db.ref('pesanan_aktif').set(orderData).then(() => {
      alert("Pesanan berhasil dibuat! Menunggu tanggapan driver.");
    }).catch((err) => {
      alert("Gagal membuat pesanan: " + err.message);
    });
  }

  // 4. Membatalkan Pesanan
  function batalkanPesanan() {
    if (confirm("Yakin ingin membatalkan pesanan?")) {
      db.ref('pesanan_aktif').remove().then(() => {
        alert("Pesanan berhasil dibatalkan.");
      });
    }
  }
</script>
</body>
</html>
