<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoPir - Admin Dashboard</title>
<style>
:root{
--primary:#00880c;--primary-dark:#006609;--secondary:#0077b6;--light:#f4f6f8;
--dark:#1e293b;--gray:#64748b;--white:#fff;--warning:#f59e0b;--danger:#ef4444;--success:#10b981;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Tahoma,Verdana,sans-serif}
body{background:#e2e8f0;color:var(--dark);display:flex;justify-content:center;min-height:100vh}
.app-container{width:100%;max-width:480px;min-height:100vh;background:#fff;box-shadow:0 0 20px rgba(0,0,0,.1);position:relative}
header{background:var(--dark);color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
header h1{font-size:1.2rem}
.btn-logout{background:rgba(255,255,255,.2);color:#fff;border:0;padding:6px 12px;border-radius:5px;cursor:pointer}
.content{padding:15px;padding-bottom:80px}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:15px;margin-bottom:15px;box-shadow:0 2px 4px rgba(0,0,0,.03)}
.btn{width:100%;padding:10px;border:0;border-radius:6px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-primary{background:var(--primary);color:#fff}
.form-control{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:6px;font-size:.95rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat-card{background:#f8fafc;border:1px solid #cbd5e1;padding:12px;border-radius:6px;text-align:center}
.stat-card .number{font-size:1.4rem;font-weight:bold;color:var(--primary)}
.img-preview-box{width:100%;height:120px;object-fit:cover;border-radius:6px;border:1px solid #cbd5e1;margin-top:5px}
.driver-card{border:1px solid #cbd5e1;border-radius:8px;padding:12px;margin-bottom:12px;background:#f8fafc}
.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:.75rem;font-weight:bold;color:#fff;margin-bottom:6px}
.badge-warning{background:var(--warning)}
.badge-success{background:var(--success)}
</style>
</head>
<body>

<div class="app-container">

<header>
  <h1>GoPir - Admin</h1>
  <button class="btn-logout" onclick="window.location.href='index.html'">Keluar</button>
</header>

<div class="content">

<h3>Admin Dashboard</h3>

<div class="grid-2" style="margin-top:10px">
  <div class="stat-card">
    <div class="number" id="stat-total-orders">0</div> Pesanan
  </div>
  <div class="stat-card">
    <div class="number" id="stat-active-orders">0</div> Aktif
  </div>
  <div class="stat-card">
    <div class="number" id="stat-drivers">0</div> Driver Aktif
  </div>
  <div class="stat-card">
    <div class="number" id="stat-pending-drivers">0</div> Pending ACC
  </div>
</div>

<div class="card" style="margin-top:15px">
  <h4>Pesanan / Transaksi Aktif</h4>
  <div id="a-active-order-list" style="margin-top:10px">
    <p style="font-size:.85rem;color:var(--gray)">Memuat data pesanan...</p>
  </div>
</div>

<div class="card">
  <h4>Pendaftaran Driver Baru</h4>
  <div id="a-driver-registration-list" style="margin-top:10px">
    <p style="font-size:.85rem;color:var(--gray)">Memuat pendaftaran...</p>
  </div>
</div>

<div class="card">
  <h4>Kelola Rute Utama</h4>
  <form onsubmit="addRoute(event)" style="display:flex;gap:5px;margin-top:10px">
    <input id="a-new-route" class="form-control" placeholder="Nama Rute Baru" required>
    <button class="btn btn-primary" style="width:100px;margin:0">Tambah</button>
  </form>
  <ul id="a-routes-list" style="margin-top:10px;padding-left:20px;font-size:.9rem">
    <li>Lintas Sofifi (Malifut - Sofifi)</li>
    <li>Lintas Tobelo (Sofifi - Tobelo)</li>
  </ul>
</div>

</div>
</div>

<!-- SDK FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
 const firebaseConfig = {
  apiKey: "AIzaSyCB9VFST65f7UhMiHg826ZYJaoBXJfY6qs",
  authDomain: "gopir-app.firebaseapp.com",
  databaseURL: "https://gopir-app-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "gopir-app",
  storageBucket: "gopir-app.firebasestorage.app",
  messagingSenderId: "213809630129",
  appId: "1:213809630129:web:544ff0f19e442652250b90"
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();

  // 1. Memantau Pesanan Aktif Real-time
  db.ref('pesanan_aktif').on('value', (snapshot) => {
    const data = snapshot.val();
    const container = document.getElementById('a-active-order-list');
    const statActive = document.getElementById('stat-active-orders');
    const statTotal = document.getElementById('stat-total-orders');

    if (data) {
      statActive.innerText = "1";
      statTotal.innerText = "1";
      let statusWarna = data.status === 'DITERIMA' ? 'var(--success)' : 'var(--warning)';

      container.innerHTML = `
        <div style="border:1px solid #cbd5e1; border-radius:6px; padding:10px; background:#f8fafc">
          <p style="font-size:.85rem"><b>Jenis:</b> ${data.jenis}</p>
          <p style="font-size:.85rem"><b>Pemesan:</b> ${data.teleponPenumpang || data.namaPengirim}</p>
          <p style="font-size:.85rem"><b>Rute:</b> ${data.lokasiAwal} ➔ ${data.lokasiTujuan}</p>
          <p style="font-size:.85rem"><b>Status:</b> <span style="color:${statusWarna};font-weight:bold">${data.status}</span></p>
          <button onclick="hapusPesanan()" style="background:var(--danger); color:#fff; border:0; padding:6px 10px; border-radius:4px; font-size:.8rem; margin-top:8px; cursor:pointer">Hapus / Riset Pesanan</button>
        </div>
      `;
    } else {
      statActive.innerText = "0";
      statTotal.innerText = "0";
      container.innerHTML = `<p style="font-size:.85rem;color:var(--gray)">Tidak ada pesanan aktif.</p>`;
    }
  });

  // 2. Memantau Pendaftaran Driver Real-time
  db.ref('drivers').on('value', (snapshot) => {
    const drivers = snapshot.val();
    const container = document.getElementById('a-driver-registration-list');
    let pendingHTML = "";
    let approvedCount = 0;
    let pendingCount = 0;

    if (drivers) {
      Object.keys(drivers).forEach(phone => {
        const d = drivers[phone];
        if (d.status === 'APPROVED') {
          approvedCount++;
        } else if (d.status === 'PENDING') {
          pendingCount++;
          pendingHTML += `
            <div class="driver-card">
              <span class="badge badge-warning">PENDING ACC</span>
              <h4 style="margin-bottom:5px">${d.nama} (${d.telepon})</h4>
              <p style="font-size:.8rem;color:var(--gray)"><b>Rute:</b> ${d.rute}</p>
              <p style="font-size:.8rem;color:var(--gray)"><b>Mobil:</b> ${d.mobil} (${d.plat})</p>
              <p style="font-size:.8rem;color:var(--gray)"><b>Alamat:</b> ${d.alamat}</p>
              
              <div class="grid-2" style="margin-top:8px">
                <div>
                  <p style="font-size:.75rem;font-weight:bold">Foto Diri:</p>
                  <img src="${d.fotoDiri}" class="img-preview-box">
                </div>
                <div>
                  <p style="font-size:.75rem;font-weight:bold">Foto Mobil:</p>
                  <img src="${d.fotoMobil}" class="img-preview-box">
                </div>
              </div>

              <div style="display:flex;gap:8px;margin-top:10px">
                <button onclick="verifikasiDriver('${d.telepon}', 'APPROVED')" style="flex:1;background:var(--success);color:#fff;border:0;padding:8px;border-radius:4px;font-weight:bold;cursor:pointer">Setujui (ACC)</button>
                <button onclick="verifikasiDriver('${d.telepon}', 'REJECTED')" style="flex:1;background:var(--danger);color:#fff;border:0;padding:8px;border-radius:4px;font-weight:bold;cursor:pointer">Tolak</button>
              </div>
            </div>
          `;
        }
      });
    }

    document.getElementById('stat-drivers').innerText = approvedCount;
    document.getElementById('stat-pending-drivers').innerText = pendingCount;

    if (pendingHTML !== "") {
      container.innerHTML = pendingHTML;
    } else {
      container.innerHTML = `<p style="font-size:.85rem;color:var(--gray)">Belum ada pendaftaran driver baru.</p>`;
    }
  });

  // Fungsi Verifikasi Driver (ACC / Tolak)
  function verifikasiDriver(phone, status) {
    const pesan = status === 'APPROVED' ? 'Setujui pendaftaran driver ini?' : 'Tolak pendaftaran driver ini?';
    if (confirm(pesan)) {
      db.ref('drivers/' + phone).update({
        status: status
      }).then(() => {
        alert("Status driver berhasil diperbarui menjadi " + status + "!");
      });
    }
  }

  function hapusPesanan() {
    if (confirm("Apakah Anda yakin ingin meriset pesanan aktif ini?")) {
      db.ref('pesanan_aktif').remove().then(() => {
        alert("Pesanan berhasil dibatalkan/direset.");
      });
    }
  }

  function addRoute(e) {
    e.preventDefault();
    const input = document.getElementById('a-new-route');
    if (input.value.trim() !== "") {
      const li = document.createElement('li');
      li.textContent = input.value;
      document.getElementById('a-routes-list').appendChild(li);
      input.value = "";
    }
  }
</script>
</body>
</html>
